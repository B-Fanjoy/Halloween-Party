<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Halloween Party Safe / Not Safe</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <span class="badge">Halloween Party</span>
        <h1>Safe or Not Safe</h1>
      </header>

      <main class="grid">
        <section class="card admin-card">
          <h2>Admin</h2>

          <div id="admin-panel" class="admin-panel hidden">
            <div class="admin-toolbar">
              <h3>Player List</h3>
              <button id="admin-logout" class="secondary" type="button">Logout</button>
            </div>

            <div id="player-list" class="player-list"></div>
          </div>
        </section>
      </main>
    </div>

    <script src="config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
